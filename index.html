<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Quiz - Dual Bank Mode</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f8f9fa;
            --sidebar-width: 300px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--bg); overflow: hidden; }
        
        /* Sidebar General Styles */
        .sidebar { 
            width: var(--sidebar-width); 
            background: white; 
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s ease;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        #left-sidebar { border-right: 1px solid #ddd; }
        #right-sidebar { border-left: 1px solid #ddd; }
        
        /* Toggle Logic */
        .hidden-left { margin-left: calc(var(--sidebar-width) * -1); }
        .hidden-right { margin-right: calc(var(--sidebar-width) * -1); }

        .sidebar-header { padding: 1.2rem; border-bottom: 1px solid #eee; background: #fff; }
        .sidebar-header h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        
        .list-container { flex-grow: 1; overflow-y: auto; padding: 0.5rem; list-style: none; margin: 0; }
        
        /* List Items */
        .bank-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 10px; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 0.85rem; 
            color: #444;
        }
        
        /* Buttons */
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            font-size: 1.1rem;
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(1.2); }
        .trash-btn { color: #bbb; }
        .trash-btn:hover { color: var(--danger); }
        .add-btn { color: var(--primary); font-weight: bold; }
        .add-btn:hover { color: var(--success); }

        /* Main Content */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; min-width: 400px; }
        .navbar { padding: 1rem; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid #ddd; }
        .quiz-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); text-align: center; width: 90%; max-width: 450px; }
        
        .word-display { font-size: 2.2rem; font-weight: bold; margin: 20px 0; color: #333; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 15px; font-size: 1.1rem; border: 2px solid #eee; border-radius: 10px; outline: none; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        .feedback { height: 30px; margin-top: 15px; font-weight: 600; }
        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }
        .hint { color: #666; font-size: 0.95rem; margin-top: 15px; min-height: 50px; background: #fefefe; padding: 10px; border-radius: 8px; border: 1px dashed #eee; }
        .answer-reveal { color: var(--primary); font-weight: bold; display: block; margin-top: 4px; }
        
        button.action-btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; }
        .btn-toggle { background: #eee; color: #333; }
        .btn-review { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-review.active { background: #ff9800; }
        
        .controls { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    </style>
</head>
<body>

<aside id="left-sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Wrong Bank</h3>
        <button id="reviewModeBtn" class="action-btn btn-review" onclick="toggleReviewMode()">Review Missed (0)</button>
    </div>
    <ul id="wrongBankList" class="list-container"></ul>
</aside>

<main id="main-content">
    <div class="navbar">
        <button class="action-btn btn-toggle" onclick="toggleSidebar('left')">☰ Wrong Bank</button>
        <div style="font-weight: 600; color: #555;">Spanish Vocab 2.4A-C</div>
        <button class="action-btn btn-toggle" onclick="toggleSidebar('right')">Total List ☰</button>
    </div>

    <div class="quiz-container">
        <div class="card">
            <div class="controls">
                <label><input type="checkbox" id="modeToggle" onchange="resetQuiz()"> Spanish ⮕ English</label>
                <span id="quizStatus" style="font-weight: bold; color: var(--primary);">All Words</span>
            </div>
            <div class="word-display" id="targetWord">Loading...</div>
            <input type="text" id="userInput" placeholder="Type answer here..." autocomplete="off">
            <div class="feedback" id="feedback"></div>
            <div class="hint" id="hintArea"></div>
        </div>
    </div>
</main>

<aside id="right-sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Total Word Bank</h3>
        <p style="font-size: 0.75rem; color: #888;">Click + to add for practice</p>
    </div>
    <ul id="totalBankList" class="list-container"></ul>
</aside>

<script>
    const rawData = [
        ["the stadium", "el estadio"], ["the synagogue", "la sinagoga"], ["the mosque", "la mezquita"],
        ["the theater", "el teatro"], ["the post office", "el correo"], ["the market", "el mercado"],
        ["the game", "el partido"], ["the border", "la frontera"], ["the capital", "la capital"],
        ["the country", "el país"], ["the countryside", "el campo"], ["the tourist", "el/la turista"],
        ["the tourism", "el turismo"], ["indigenous", "indígena"], ["none", "ninguno", "ninguna"],
        ["at least", "por lo menos"], ["to turn / to fold", "doblar"], ["Turn… (command)", "Dobla"],
        ["to cross", "cruzar"], ["Cross… (command)", "Cruza"], ["to continue", "seguir"],
        ["Continue / keep going", "Sigue"], ["address", "la dirección"], ["apartment", "el apartamento"],
        ["bakery", "la panadería"], ["bank", "el banco"], ["block", "la cuadra", "la manzana"],
        ["book store", "la librería"], ["bus", "el autobús"], ["bus stop", "la parada de autobús"],
        ["cathedral", "la catedral"], ["church", "la iglesia"], ["climate", "el clima"],
        ["directions", "las indicaciones"], ["fire station", "la estación de bomberos"], ["floor", "el piso", "la planta"],
        ["fruit store/stand", "la frutería"], ["gallery", "la galería"], ["highway", "la autopista", "la carretera"],
        ["home", "el hogar"], ["hostel", "el hostal"], ["lake", "el lago"], ["library", "la biblioteca"],
        ["map", "el mapa"], ["meat shop", "la carnicería"], ["neighborhood", "el barrio"],
        ["ocean", "el océano"], ["police station", "la estación de policía"], ["river", "el río"],
        ["school", "la escuela"], ["sea", "el mar"], ["store", "la tienda"], ["street", "la calle"],
        ["town", "el pueblo"], ["train", "el tren"], ["vegetable store/stand", "la verdulería"],
        ["East", "el Este"], ["North", "el Norte"], ["West", "el Oeste"], ["South", "el Sur"],
        ["far from", "lejos de"], ["next to", "al lado de"], ["close to", "cerca de"],
        ["to the left", "a la izquierda"], ["to the right", "a la derecha"], ["across from", "en frente de"],
        ["around the block", "a la vuelta de la esquina"], ["currency", "la moneda"], 
        ["language", "el idioma", "la lengua"], ["avenue", "la avenida"], ["to travel", "viajar"],
        ["Excuse me (fam)", "Disculpa", "Perdona"], ["Excuse me (formal)", "Disculpe", "Perdone"],
        ["location", "la ubicación", "la locación"], ["place", "el lugar", "el sitio"]
    ];

    let currentWordObj = {};
    let isSpanishToEnglish = false;
    let wrongCounter = 0;
    let wrongBank = new Set();
    let isReviewMode = false;

    // Elements
    const targetEl = document.getElementById('targetWord');
    const inputEl = document.getElementById('userInput');
    const feedbackEl = document.getElementById('feedback');
    const hintArea = document.getElementById('hintArea');
    const modeToggle = document.getElementById('modeToggle');
    const wrongListEl = document.getElementById('wrongBankList');
    const totalListEl = document.getElementById('totalBankList');
    const reviewBtn = document.getElementById('reviewModeBtn');
    const statusEl = document.getElementById('quizStatus');

    function toggleSidebar(side) {
        if (side === 'left') document.getElementById('left-sidebar').classList.toggle('hidden-left');
        if (side === 'right') document.getElementById('right-sidebar').classList.toggle('hidden-right');
    }

    function normalize(str) {
        return str.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/\b(el|la|los|las|the|a|an)\b/g, "")
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"")
            .replace(/\s+/g, ' ')
            .trim();
    }

    function addToBank(index) {
        if (!wrongBank.has(index)) {
            wrongBank.add(index);
            updateWrongBankUI();
        }
    }

    function removeFromBank(index) {
        wrongBank.delete(index);
        updateWrongBankUI();
        if (wrongBank.size === 0 && isReviewMode) toggleReviewMode();
    }

    function updateWrongBankUI() {
        wrongListEl.innerHTML = "";
        wrongBank.forEach(index => {
            const li = document.createElement('li');
            li.className = "bank-item";
            li.innerHTML = `<span>${rawData[index][0]}</span>
                            <button class="icon-btn trash-btn" onclick="removeFromBank(${index})">🗑</button>`;
            wrongListEl.appendChild(li);
        });
        reviewBtn.innerText = `Review Missed (${wrongBank.size})`;
        reviewBtn.disabled = wrongBank.size === 0;
    }

    function initTotalBankUI() {
        totalListEl.innerHTML = "";
        rawData.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = "bank-item";
            li.innerHTML = `<span style="max-width: 80%">${item[0]}</span>
                            <button class="icon-btn add-btn" onclick="addToBank(${index})">+</button>`;
            totalListEl.appendChild(li);
        });
    }

    function toggleReviewMode() {
        if (wrongBank.size === 0 && !isReviewMode) return;
        isReviewMode = !isReviewMode;
        reviewBtn.classList.toggle('active', isReviewMode);
        statusEl.innerText = isReviewMode ? "Reviewing Missed" : "All Words";
        nextWord();
    }

    function resetQuiz() {
        isSpanishToEnglish = modeToggle.checked;
        nextWord();
    }

    function nextWord() {
        wrongCounter = 0;
        let index;
        if (isReviewMode && wrongBank.size > 0) {
            const missedIndices = Array.from(wrongBank);
            index = missedIndices[Math.floor(Math.random() * missedIndices.length)];
        } else {
            index = Math.floor(Math.random() * rawData.length);
        }

        const choice = rawData[index];
        if (isSpanishToEnglish) {
            const spanishOptions = choice.slice(1);
            currentWordObj = { index, question: spanishOptions[Math.floor(Math.random() * spanishOptions.length)], answers: [choice[0]] };
        } else {
            currentWordObj = { index, question: choice[0], answers: choice.slice(1) };
        }

        targetEl.innerText = currentWordObj.question;
        inputEl.value = "";
        feedbackEl.innerText = "";
        hintArea.innerHTML = "";
        inputEl.focus();
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const userVal = normalize(inputEl.value);
            const isCorrect = currentWordObj.answers.some(ans => normalize(ans) === userVal);

            if (isCorrect) {
                feedbackEl.className = "feedback correct";
                feedbackEl.innerText = "¡Correcto!";
                hintArea.innerHTML = "Correct: <span class='answer-reveal'>" + currentWordObj.answers.join(" / ") + "</span>";
                setTimeout(nextWord, 1200);
            } else {
                wrongCounter++;
                feedbackEl.className = "feedback incorrect";
                feedbackEl.innerText = "Try again!";
                addToBank(currentWordObj.index);
                if (wrongCounter >= 3) {
                    hintArea.innerHTML = "Hint: <span class='answer-reveal'>" + currentWordObj.answers.join(" / ") + "</span>";
                }
                inputEl.value = "";
            }
        }
    });

    // Start Up
    initTotalBankUI();
    nextWord();
</script>

</body>
</html>
