<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Quiz with Hideable Bank</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f8f9fa;
            --sidebar-width: 300px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--bg); overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { 
            width: var(--sidebar-width); 
            background: white; 
            border-right: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            transition: margin-left 0.3s ease;
            z-index: 10;
        }
        /* Class to hide sidebar */
        #sidebar.hidden { margin-left: calc(var(--sidebar-width) * -1); }

        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid #eee; background: #fff; }
        #wrongBankList { flex-grow: 1; overflow-y: auto; padding: 1rem; list-style: none; margin: 0; }
        #wrongBankList li { padding: 8px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; color: #555; }
        
        /* Main Content Styles */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Navbar for Toggle */
        .navbar { padding: 1rem; display: flex; align-items: center; background: white; border-bottom: 1px solid #ddd; }
        
        .quiz-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); text-align: center; width: 90%; max-width: 450px; }
        
        .word-display { font-size: 2.2rem; font-weight: bold; margin: 20px 0; color: #333; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 15px; font-size: 1.1rem; border: 2px solid #eee; border-radius: 10px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        .feedback { height: 30px; margin-top: 15px; font-weight: 600; font-size: 1.1rem; }
        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }
        .hint { color: #666; font-size: 0.95rem; margin-top: 15px; min-height: 50px; background: #fefefe; padding: 10px; border-radius: 8px; }
        .answer-reveal { color: var(--primary); font-weight: bold; display: block; margin-top: 4px; }
        
        /* Buttons */
        button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; transition: all 0.2s; }
        .btn-toggle { background: #eee; color: #333; margin-right: 15px; }
        .btn-toggle:hover { background: #ddd; }
        .btn-review { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-review.active { background: #ff9800; box-shadow: 0 0 10px rgba(255,152,0,0.4); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .controls { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">
        <h3>Wrong Answer Bank</h3>
        <p style="font-size: 0.8rem; color: #888;">Session History</p>
        <button id="reviewModeBtn" class="btn-review" onclick="toggleReviewMode()">Review Missed (0)</button>
    </div>
    <ul id="wrongBankList"></ul>
</aside>

<main id="main-content">
    <div class="navbar">
        <button class="btn-toggle" onclick="toggleSidebar()">☰ Toggle Bank</button>
        <div style="font-weight: 600; color: #555;">Vocabulary Practice</div>
    </div>

    <div class="quiz-container">
        <div class="card">
            <div class="controls">
                <label><input type="checkbox" id="modeToggle" onchange="resetQuiz()"> Spanish ⮕ English</label>
                <span id="quizStatus" style="font-weight: bold; color: var(--primary);">All Words</span>
            </div>
            <div class="word-display" id="targetWord">Loading...</div>
            <input type="text" id="userInput" placeholder="Type answer here..." autocomplete="off">
            <div class="feedback" id="feedback"></div>
            <div class="hint" id="hintArea"></div>
        </div>
    </div>
</main>

<script>
    const rawData = [
        ["the stadium", "el estadio"], ["the synagogue", "la sinagoga"], ["the mosque", "la mezquita"],
        ["the theater", "el teatro"], ["the post office", "el correo"], ["the market", "el mercado"],
        ["the game", "el partido"], ["the border", "la frontera"], ["the capital", "la capital"],
        ["the country", "el país"], ["the countryside", "el campo"], ["the tourist", "el/la turista"],
        ["the tourism", "el turismo"], ["indigenous", "indígena"], ["none", "ninguno", "ninguna"],
        ["at least", "por lo menos"], ["to turn / to fold", "doblar"], ["Turn… (command)", "Dobla"],
        ["to cross", "cruzar"], ["Cross… (command)", "Cruza"], ["to continue", "seguir"],
        ["Continue / keep going", "Sigue"], ["address", "la dirección"], ["apartment", "el apartamento"],
        ["bakery", "la panadería"], ["bank", "el banco"], ["block", "la cuadra", "la manzana"],
        ["book store", "la librería"], ["bus", "el autobús"], ["bus stop", "la parada de autobús"],
        ["cathedral", "la catedral"], ["church", "la iglesia"], ["climate", "el clima"],
        ["directions", "las indicaciones"], ["fire station", "la estación de bomberos"], ["floor", "el piso", "la planta"],
        ["fruit store/stand", "la frutería"], ["gallery", "la galería"], ["highway", "la autopista", "la carretera"],
        ["home", "el hogar"], ["hostel", "el hostal"], ["lake", "el lago"], ["library", "la biblioteca"],
        ["map", "el mapa"], ["meat shop", "la carnicería"], ["neighborhood", "el barrio"],
        ["ocean", "el océano"], ["police station", "la estación de policía"], ["river", "el río"],
        ["school", "la escuela"], ["sea", "el mar"], ["store", "la tienda"], ["street", "la calle"],
        ["town", "el pueblo"], ["train", "el tren"], ["vegetable store/stand", "la verdulería"],
        ["East", "el Este"], ["North", "el Norte"], ["West", "el Oeste"], ["South", "el Sur"],
        ["far from", "lejos de"], ["next to", "al lado de"], ["close to", "cerca de"],
        ["to the left", "a la izquierda"], ["to the right", "a la derecha"], ["across from", "en frente de"],
        ["around the block", "a la vuelta de la esquina"], ["currency", "la moneda"], 
        ["language", "el idioma", "la lengua"], ["avenue", "la avenida"], ["to travel", "viajar"],
        ["Excuse me (fam)", "Disculpa", "Perdona"], ["Excuse me (formal)", "Disculpe", "Perdone"],
        ["location", "la ubicación", "la locación"], ["place", "el lugar", "el sitio"]
    ];

    let currentWordObj = {};
    let isSpanishToEnglish = false;
    let wrongCounter = 0;
    let wrongBank = new Set();
    let isReviewMode = false;

    const targetEl = document.getElementById('targetWord');
    const inputEl = document.getElementById('userInput');
    const feedbackEl = document.getElementById('feedback');
    const hintArea = document.getElementById('hintArea');
    const modeToggle = document.getElementById('modeToggle');
    const bankListEl = document.getElementById('wrongBankList');
    const reviewBtn = document.getElementById('reviewModeBtn');
    const statusEl = document.getElementById('quizStatus');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar() {
        sidebar.classList.toggle('hidden');
    }

    function normalize(str) {
        return str.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/\b(el|la|los|las|the|a|an)\b/g, "")
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"")
            .replace(/\s+/g, ' ')
            .trim();
    }

    function updateBankUI() {
        bankListEl.innerHTML = "";
        wrongBank.forEach(index => {
            const li = document.createElement('li');
            li.innerText = `${rawData[index][0]} — ${rawData[index].slice(1).join(', ')}`;
            bankListEl.appendChild(li);
        });
        reviewBtn.innerText = `Review Missed (${wrongBank.size})`;
        reviewBtn.disabled = wrongBank.size === 0;
        if (wrongBank.size === 0 && isReviewMode) toggleReviewMode();
    }

    function toggleReviewMode() {
        if (wrongBank.size === 0) return;
        isReviewMode = !isReviewMode;
        reviewBtn.classList.toggle('active', isReviewMode);
        statusEl.innerText = isReviewMode ? "Reviewing Missed" : "All Words";
        nextWord();
    }

    function resetQuiz() {
        isSpanishToEnglish = modeToggle.checked;
        nextWord();
    }

    function nextWord() {
        wrongCounter = 0;
        let index;
        
        if (isReviewMode && wrongBank.size > 0) {
            const missedIndices = Array.from(wrongBank);
            index = missedIndices[Math.floor(Math.random() * missedIndices.length)];
        } else {
            index = Math.floor(Math.random() * rawData.length);
        }

        const choice = rawData[index];
        
        if (isSpanishToEnglish) {
            const spanishOptions = choice.slice(1);
            currentWordObj = {
                index: index,
                question: spanishOptions[Math.floor(Math.random() * spanishOptions.length)],
                answers: [choice[0]]
            };
        } else {
            currentWordObj = {
                index: index,
                question: choice[0],
                answers: choice.slice(1)
            };
        }

        targetEl.innerText = currentWordObj.question;
        inputEl.value = "";
        feedbackEl.innerText = "";
        hintArea.innerHTML = "";
        inputEl.focus();
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const userVal = normalize(inputEl.value);
            const isCorrect = currentWordObj.answers.some(ans => normalize(ans) === userVal);

            if (isCorrect) {
                feedbackEl.className = "feedback correct";
                feedbackEl.innerText = "¡Correcto!";
                hintArea.innerHTML = "Proper spelling: <br><span class='answer-reveal'>" + currentWordObj.answers.join(" / ") + "</span>";
                
                // If in review mode and they got it right, you could choose to remove it from bank.
                // For now, it stays in the bank so they can see their history.
                
                setTimeout(nextWord, 1500);
            } else {
                wrongCounter++;
                feedbackEl.className = "feedback incorrect";
                feedbackEl.innerText = "Try again!";
                
                if (!wrongBank.has(currentWordObj.index)) {
                    wrongBank.add(currentWordObj.index);
                    updateBankUI();
                }

                if (wrongCounter >= 3) {
                    hintArea.innerHTML = "The correct answer is: <br><span class='answer-reveal'>" + currentWordObj.answers.join(" / ") + "</span>";
                }
                inputEl.value = "";
            }
        }
    });

    nextWord();
    updateBankUI();
</script>

</body>
</html>
